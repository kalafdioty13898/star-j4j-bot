name: J4J Bot Run

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: j4j-bot-run
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run J4J Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING2: ${{ secrets.SESSION_STRING2 }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          BETWEEN_GROUPS_DELAY: '60'
          JITTER: '5'
        run: python j4j_bot.py

      - name: 💾 Commit state.json
        run: |
          git config user.name "j4j-bot-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f state.json ]; then
            if git diff --quiet state.json; then
              echo "ℹ️ تغییری در state.json نیست — commit نشد"
            else
              git add state.json
              git commit -m "chore: update state.json [skip ci]"
              git push
              echo "✅ state.json commit شد"
            fi
          fi

      - name: 📊 Show summary
        if: always()
        run: |
          echo "================================================"
          echo "📋 J4J Bot Run Summary"
          echo "================================================"
          if [ -f state.json ]; then
            cat state.json | python -m json.tool | head -25
          fi
          if [ -f j4j_bot.log ]; then
            echo ""
            echo "📜 آخرین لاگ‌ها:"
            tail -20 j4j_bot.log
          fi
